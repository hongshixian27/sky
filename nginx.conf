worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  access_log off;
  client_max_body_size 0;
  proxy_buffering off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 0.0.0.0:8080;
    server_name beta.ws.dkwhn.ccwu.cc beta.ws.idkwin.icu;

    location = /account/ws {
      proxy_pass http://127.0.0.1:8091;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_request_headers on;
      proxy_pass_request_body on;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_redirect off;
      proxy_intercept_errors off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass https://__UPSTREAM_ADDR__:443;
      proxy_http_version 1.1;
      proxy_set_header Host __UPSTREAM_ADDR__;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_request_headers on;
      proxy_pass_request_body on;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_redirect off;
      proxy_intercept_errors off;
      proxy_ssl_server_name on;
      proxy_ssl_name __UPSTREAM_ADDR__;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  server {
    listen 0.0.0.0:8080;
    server_name live.ws.idkwin.icu;

    location = /account/ws {
      proxy_pass http://127.0.0.1:8091;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_request_headers on;
      proxy_pass_request_body on;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_redirect off;
      proxy_intercept_errors off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass https://__LIVE_UPSTREAM_ADDR__:443;
      proxy_http_version 1.1;
      proxy_set_header Host __LIVE_UPSTREAM_ADDR__;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass_request_headers on;
      proxy_pass_request_body on;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_redirect off;
      proxy_intercept_errors off;
      proxy_ssl_server_name on;
      proxy_ssl_name __LIVE_UPSTREAM_ADDR__;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  server {
    listen 0.0.0.0:8080 default_server;
    server_name _;

    location = /account/ws {
      proxy_pass http://127.0.0.1:8091;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /blog {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /yan/ios.ipa {
      return 302 https://$host/alist/d/yan/ios.ipa;
    }

    location /apk {
      proxy_pass http://127.0.0.1:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 30s;
    }

    location = /alist {
      return 302 https://$host/alist/;
    }

    location /alist/ {
      proxy_pass http://127.0.0.1:5244/alist/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass https://__UPSTREAM_ADDR__;
      proxy_http_version 1.1;
      proxy_set_header Host __UPSTREAM_ADDR__;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_ssl_name __UPSTREAM_ADDR__;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
